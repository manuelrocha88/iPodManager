[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipodmanager"
version = "0.1.0"
description = "A free, cross-platform music manager for classic iPods (Nano 1G/2G, Video 5G, Mini, Classic 6G/7G). Works where modern iTunes/Finder no longer does."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Manuel Rocha" }]
requires-python = ">=3.9"
keywords = ["ipod", "nano", "classic", "music", "itunesdb", "manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mutagen>=1.46",
    "customtkinter>=5.2",
    "pillow>=10.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]
build = ["pyinstaller>=6"]

[project.scripts]
ipodmanager = "ipod_manager.__main__:main"
ipodmanager-cli = "ipod_manager.cli:main"

[project.urls]
Homepage = "https://github.com/manuelrocha88/iPodManager"
Repository = "https://github.com/manuelrocha88/iPodManager"
Issues = "https://github.com/manuelrocha88/iPodManager/issues"

[tool.setuptools.packages.find]
include = ["ipod_manager*"]

[tool.setuptools.package-data]
"ipod_manager" = ["gui/assets/*", "templates/*.bin"]
